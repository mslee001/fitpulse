{% extends "base.html" %}
{% block title %}New user — FitPulse{% endblock %}
{% block nav_training %}active{% endblock %}

{% block content %}
<div class="ui-page-header">
  <div>
    <a href="{% url 'admin_users' %}" class="text-sm">← Users</a>
    <h1 class="ui-page-title">New user</h1>
  </div>
</div>

<div class="ui-panel max-w-xl">
  {% if error %}<div role="alert" class="alert alert-soft alert-error mb-4">{{ error }}</div>{% endif %}
  <form method="post" class="flex flex-col gap-3">
    {% csrf_token %}
    <label class="fieldset py-0" for="id_username"><span class="fieldset-legend">Username</span>
      <input class="input w-full" id="id_username" name="username" value="{{ username }}" required autocomplete="off">
    </label>
    <label class="fieldset py-0" for="id_first_name"><span class="fieldset-legend">First name (optional)</span>
      <input class="input w-full" id="id_first_name" name="first_name" value="{{ first_name }}" autocomplete="off">
    </label>
    <label class="fieldset py-0" for="id_email"><span class="fieldset-legend">Email (optional)</span>
      <input class="input w-full" id="id_email" name="email" type="email" value="{{ email }}" autocomplete="off">
      <span class="label whitespace-normal">They'll get a welcome email with a link to choose their password and get started.</span>
    </label>
    <label class="fieldset py-0" for="id_preset"><span class="fieldset-legend">Start with</span>
      <select class="select w-full" id="id_preset" name="preset">
        {% for key, value in presets.items %}
        <option value="{{ key }}" {% if key == preset %}selected{% endif %}>{{ value.0 }}</option>
        {% endfor %}
      </select>
      <span class="label whitespace-normal">You can change individual features on the next page.</span>
    </label>
    <div class="mt-2"><button type="submit" class="btn btn-primary max-sm:w-full">Create user</button></div>
  </form>
</div>
{% endblock %}
