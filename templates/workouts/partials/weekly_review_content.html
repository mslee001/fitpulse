{% load workout_filters %}
{% if error %}
<div role="alert" class="alert alert-soft alert-error">{{ error }}</div>
{% elif pending %}
<div class="flex items-center gap-2 py-2 text-sm text-muted" role="status"
  hx-get="{% url 'weekly_review_check' %}?week={{ week_start|date:'Y-m-d' }}"
  hx-trigger="load, every 30s"
  hx-target="this"
  hx-swap="outerHTML">
  <span class="loading loading-dots loading-sm text-primary" aria-hidden="true"></span>
  <span>Generating your weekly review — Claude Sonnet is crunching the numbers. This usually takes a few minutes.
  <span class="block text-xs">Checking automatically every 30s…</span></span>
</div>
{% elif review %}
<div>
  {{ review.content|format_nutrition_insights }}
</div>
{% endif %}
