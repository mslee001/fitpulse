<div class="feature-row">
  <form hx-post="{% url 'admin_user_feature_toggle' target.pk row.slug %}"
        hx-target="closest .feature-row" hx-swap="outerHTML transition:true">
    {% csrf_token %}
    <label class="flex min-h-11 cursor-pointer items-start gap-3 py-1.5{% if row.ai and not target.is_superuser and not target.access.ai_enabled %} opacity-60{% endif %}">
      <input type="checkbox" class="toggle toggle-sm toggle-primary mt-0.5" {% if row.granted or target.is_superuser %}checked{% endif %} onchange="htmx.trigger(this.form, 'submit')"
             {% if target.is_superuser %}disabled{% endif %}>
      <span class="text-sm">
        <span class="font-medium">{{ row.label }}</span>
        {% if row.needs %}<span class="ml-1 text-xs text-muted">Needs: {{ row.needs|join:", " }}</span>{% endif %}
        {% if row.granted and row.ai and not target.is_superuser and not target.access.ai_enabled %}<span class="ml-1 text-xs text-warning">AI is off</span>{% endif %}
        {% if row.note %}<span class="mt-0.5 block text-xs text-muted">{{ row.note }}</span>{% endif %}
      </span>
    </label>
  </form>
</div>
