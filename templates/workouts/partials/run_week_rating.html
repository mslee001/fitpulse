{% load workout_filters %}
<div class="mb-2" id="rw-rating-{{ row.run_week.pk }}">
  {% if row.has_done %}
    <form hx-post="{% url 'run_week_rate' row.run_week.pk %}"
          hx-target="#rw-rating-{{ row.run_week.pk }}" hx-swap="outerHTML"
          class="flex flex-wrap items-center gap-2">
      {% csrf_token %}
      <label class="flex items-center gap-2 text-sm text-muted">RPE
        <select name="rpe" class="select select-sm w-auto">
          <option value="">&mdash;</option>
          {% for n in 10|to_range %}
          <option value="{{ n }}"{% if row.run_week.rpe == n %} selected{% endif %}>{{ n }}</option>
          {% endfor %}
        </select>
      </label>
      {% if row.run_week.rpe %}<span class="badge badge-sm font-mono {% if row.run_week.rpe >= 8 %}badge-error badge-soft{% elif row.run_week.rpe <= 3 %}badge-info badge-soft{% else %}badge-ghost{% endif %}">{{ row.run_week.rpe }}/10</span>{% endif %}
      <input type="text" name="note" class="input input-sm min-w-44 flex-1 sm:max-w-80" maxlength="280" aria-label="Week note"
             placeholder="what felt hardest / body-awareness note&hellip;" value="{{ row.run_week.note|default:'' }}">
      <button class="btn btn-ghost btn-sm" type="submit">Save</button>
    </form>
  {% endif %}
</div>
