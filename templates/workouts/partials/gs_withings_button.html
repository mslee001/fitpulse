<form method="post" action="{% url 'withings_oauth_connect' %}" style="margin:0 0 0.5rem">
  {% csrf_token %}
  <input type="hidden" name="next" value="/get-started/#withings">
  <button type="submit" class="btn {% if label == 'Reconnect' %}btn-sm btn-ghost{% else %}btn-accent{% endif %}">{{ label }}</button>
</form>
