{% if title %}<button type="button" class="btn btn-ghost btn-xs btn-circle align-middle font-serif text-muted italic" popovertarget="mh-{{ uid }}" aria-label="What is {{ title }}?" style="anchor-name: --mh-{{ uid }}">i</button><div id="mh-{{ uid }}" popover class="ui-enter m-0 max-w-64 rounded-box border border-subtle bg-base-100 p-3 text-left text-sm font-normal text-base-content shadow-lg" style="position-anchor: --mh-{{ uid }}"><p class="font-semibold">{{ title }}</p><p class="text-muted">{{ text }}</p></div>{% endif %}
