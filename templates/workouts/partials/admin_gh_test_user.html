<form id="admin-gh-test-user" hx-post="{% url 'admin_user_gh_test_user' target.pk %}" hx-target="this" hx-swap="outerHTML" class="mb-3">
  {% csrf_token %}
  <label class="flex min-h-11 cursor-pointer items-start gap-3">
    <input type="checkbox" class="toggle toggle-sm toggle-primary mt-0.5" {% if access.google_test_user_added %}checked{% endif %} onchange="htmx.trigger(this.form, 'submit')">
    <span class="text-sm">
      <span class="font-medium">Google test user added</span>
      <span class="mt-0.5 block text-xs text-muted">
        Add their Google account under Google Cloud console → APIs &amp; Services → OAuth consent screen → Test users,
        then tick this box. Their Google Health Connect button stays disabled until you do.
      </span>
    </span>
  </label>
</form>
