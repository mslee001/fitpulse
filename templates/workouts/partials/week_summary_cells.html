<td class="whitespace-nowrap text-center font-mono font-semibold tabular-nums {% if hit is not None and hit < 4 %}text-warning{% endif %}">{% if avg %}{{ avg }}{{ unit }}{% if hit is not None and hit < 4 %} <span aria-hidden="true">⚠</span><span class="sr-only">(target hit on fewer than 4 days)</span>{% endif %}{% else %}–{% endif %}</td>
{% if targets %}<td class="whitespace-nowrap text-center font-mono tabular-nums {% if hit is not None %}{% if hit >= 5 %}text-success{% elif hit < 3 %}text-warning{% endif %}{% else %}text-faint{% endif %}">{% if hit is not None %}{{ hit }}/{{ weekly.complete_days }}{% else %}–{% endif %}</td>{% endif %}
