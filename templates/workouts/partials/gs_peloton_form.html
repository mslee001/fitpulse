{% include "workouts/partials/peloton_token_help.html" %}
<form method="post" action="{% url 'set_peloton_auth' %}" class="gs-inline-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="/get-started/#peloton">
  <input type="password" name="refresh_token" class="form-input" autocomplete="off" placeholder="Paste your Peloton sign-in token" required style="min-width:16rem">
  <button type="submit" class="btn btn-primary">Connect</button>
</form>
