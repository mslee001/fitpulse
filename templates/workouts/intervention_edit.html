{% extends "base.html" %}
{% load workout_filters %}
{% block title %}Edit {{ iv.name }} — FitPulse{% endblock %}
{% block nav_body_group %}active{% endblock %}

{% block content %}
<div class="ui-page-header">
  <div>
    <a href="{% url 'interventions' %}" class="text-sm">← Interventions</a>
    <h1 class="ui-page-title mt-1">Edit intervention</h1>
  </div>
</div>

<div class="ui-panel max-w-2xl">
  <form method="post">
    {% csrf_token %}
    <div class="grid grid-cols-1 gap-x-4 md:grid-cols-2">
      <label class="fieldset py-0 md:col-span-2"><span class="fieldset-legend">Name *</span>
        <input name="name" class="input w-full" value="{{ iv.name }}" required>
      </label>
      <label class="fieldset py-0"><span class="fieldset-legend">Category</span>
        <select name="category" class="select w-full">
          {% for val, label in category_choices %}
          <option value="{{ val }}" {% if iv.category == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="fieldset py-0"><span class="fieldset-legend">Dose summary</span>
        <input class="input w-full" value="{{ iv.dose_summary }}" disabled title="Manage doses via the detail page">
        <span class="label whitespace-normal">Edit individual dose changes on the <a href="{% url 'intervention_detail' iv.pk %}">Manage Doses</a> page.</span>
      </label>
      <label class="fieldset py-0"><span class="fieldset-legend">Start date *</span>
        <input name="start_date" type="date" class="input w-full" value="{{ iv.start_date|date:'Y-m-d' }}" required>
      </label>
      <label class="fieldset py-0"><span class="fieldset-legend">End date</span>
        <input name="end_date" type="date" class="input w-full" value="{{ iv.end_date|date:'Y-m-d' }}">
      </label>
      <label class="fieldset py-0 md:col-span-2"><span class="fieldset-legend">Expected effects</span>
        <input name="expected_effects" class="input w-full" value="{{ iv.expected_effects }}">
      </label>
      <label class="fieldset py-0 md:col-span-2"><span class="fieldset-legend">Notes</span>
        <textarea name="notes" class="textarea w-full">{{ iv.notes }}</textarea>
      </label>
    </div>
    <div class="mt-4 flex gap-3">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{% url 'interventions' %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
