{% extends "base.html" %}
{% block title %}Sign in — FitPulse{% endblock %}
{% block content %}
<div class="ui-panel mx-auto mt-16 w-full max-w-sm">
  <div class="mb-1 text-2xl font-bold tracking-tight">FitPulse</div>
  <h1 class="mb-5 text-sm text-muted">Sign in to your account</h1>
  <form method="post" class="flex flex-col gap-3">
    {% csrf_token %}
    {% if form.errors %}
      <div role="alert" class="alert alert-soft alert-error">Invalid username or password.</div>
    {% endif %}
    <label class="fieldset py-0" for="id_username"><span class="fieldset-legend">Username</span>
      <input type="text" class="input w-full" name="username" id="id_username" autocomplete="username" autofocus required>
    </label>
    <label class="fieldset py-0" for="id_password"><span class="fieldset-legend">Password</span>
      <input type="password" class="input w-full" name="password" id="id_password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary mt-2 w-full">Sign in</button>
  </form>
</div>
{% endblock %}
