{% extends "base.html" %}
{% block title %}Choose a password — FitPulse{% endblock %}

{% block content %}
<div class="ui-panel mx-auto mt-16 w-full max-w-sm">
  <div class="mb-1 text-2xl font-bold tracking-tight">FitPulse</div>
  <h1 class="text-lg font-semibold">Choose a password</h1>
  <p class="mb-5 text-sm text-muted">Replace the temporary password you were given with one only you know.</p>
  <form method="post" class="flex flex-col gap-3">
    {% csrf_token %}
    {% include "registration/password_fields.html" %}
    <button type="submit" class="btn btn-primary mt-2 w-full">Save password</button>
  </form>
</div>
{% endblock %}
